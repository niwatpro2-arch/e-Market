<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลังบ้าน Supabase | หนองไม้งาม 2 SHOP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#241b16;font-family:Kanit,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.brand{font-size:26px;font-weight:700}.brand span{color:#f97316}.card{background:#fff;border:1px solid #f0dfd0;border-radius:18px;padding:20px;box-shadow:0 10px 35px #6b3d180c}.login{max-width:420px;margin:10vh auto}.input{width:100%;height:44px;border:1px solid #ddd0c5;border-radius:9px;padding:0 12px;font:inherit;margin:6px 0 12px}.btn{height:42px;border:0;border-radius:9px;padding:0 16px;background:#f97316;color:#fff;font:inherit;font-weight:600;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:28px;color:#ea580c}.muted{color:#817267}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee3da;font-size:14px}.select{border:1px solid #ddd0c5;border-radius:8px;padding:7px;font:inherit}.error{color:#b42318;background:#fff1f0;padding:10px;border-radius:9px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main class="wrap"><section id="login" class="card login"><div class="brand">หนองไม้งาม 2 <span>ADMIN</span></div><p class="muted">เข้าสู่ระบบด้วย Supabase Auth</p><input id="email" class="input" type="email" placeholder="อีเมลผู้ดูแล"><input id="password" class="input" type="password" placeholder="รหัสผ่าน"><button class="btn" style="width:100%" onclick="signIn()">เข้าสู่ระบบ</button><div id="loginError"></div></section><section id="app" style="display:none"><div class="top"><div><div class="brand">หนองไม้งาม 2 <span>ADMIN</span></div><div class="muted">Supabase Admin Dashboard</div></div><button class="btn" onclick="signOut()">ออกจากระบบ</button></div><div class="stats"><div class="card stat">ออเดอร์ทั้งหมด<b id="all">0</b></div><div class="card stat">รอรับ<b id="pending">0</b></div><div class="card stat">กำลังเตรียม<b id="preparing">0</b></div><div class="card stat">พร้อมรับ<b id="ready">0</b></div></div><section class="card" style="margin-top:14px"><h2>คำสั่งซื้อ</h2><div id="orders">กำลังโหลด...</div></section></section></main><script src="supabase.js"></script><script>const labels={pending:'รอรับคำสั่งซื้อ',confirmed:'ยืนยันแล้ว',preparing:'กำลังเตรียม',ready:'พร้อมรับ',completed:'รับสินค้าแล้ว',cancelled:'ยกเลิก'};const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function signIn(){const box=document.getElementById('loginError');box.innerHTML='';try{const sb=await NongMaiNgamSupabase.getSupabase();const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)throw error;await boot()}catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function boot(){const sb=await NongMaiNgamSupabase.getSupabase();const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:profile,error}=await sb.from('profiles').select('role').eq('id',user.id).single();if(error||profile?.role!=='admin'){await sb.auth.signOut();document.getElementById('loginError').innerHTML='<div class="error">บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลระบบ</div>';return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadOrders()}async function loadOrders(){const sb=await NongMaiNgamSupabase.getSupabase();const {data,error}=await sb.from('orders').select('id,order_number,customer_name,total_amount,status,created_at').order('created_at',{ascending:false});if(error){document.getElementById('orders').innerHTML='<div class="error">'+esc(error.message)+'</div>';return}document.getElementById('all').textContent=data.length;document.getElementById('pending').textContent=data.filter(x=>x.status==='pending').length;document.getElementById('preparing').textContent=data.filter(x=>x.status==='preparing').length;document.getElementById('ready').textContent=data.filter(x=>x.status==='ready').length;document.getElementById('orders').innerHTML=data.length?'<table class="table"><thead><tr><th>ออเดอร์</th><th>ผู้สั่ง</th><th>ยอดรวม</th><th>สถานะ</th><th>วันที่</th></tr></thead><tbody>'+data.map(o=>`<tr><td><b>${esc(o.order_number)}</b></td><td>${esc(o.customer_name)}</td><td>฿${Number(o.total_amount).toLocaleString('th-TH')}</td><td><select class="select" onchange="changeStatus('${o.id}',this.value)">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${v===o.status?'selected':''}>${l}</option>`).join('')}</select></td><td>${new Date(o.created_at).toLocaleString('th-TH')}</td></tr>`).join('')+'</tbody></table>':'<div class="muted">ยังไม่มีคำสั่งซื้อ</div>'}async function changeStatus(id,status){const sb=await NongMaiNgamSupabase.getSupabase();const {error}=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadOrders()}async function signOut(){const sb=await NongMaiNgamSupabase.getSupabase();await sb.auth.signOut();location.reload()}boot()</script></body></html>

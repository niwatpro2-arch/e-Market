<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ติดตามคำสั่งซื้อ · หนองไม้งาม 2 SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#f97316;--o2:#fb923c;--cream:#fff7ed;--dark:#1f2937;--muted:#6b7280;--line:#f1e4d7}*{box-sizing:border-box}body{margin:0;font-family:Kanit,sans-serif;color:var(--dark);background:linear-gradient(135deg,#fff7ed,#fff 65%);min-height:100vh}.nav{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:20px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--o),#ea580c);color:#fff;display:grid;place-items:center}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:400}.btn{border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600}.primary{background:var(--o);color:#fff}.dark{background:#171717;color:#fff}.wrap{max-width:760px;margin:0 auto;padding:70px 20px}.hero{text-align:center}.eyebrow{display:inline-block;background:#fff;border:1px solid #fed7aa;color:#c2410c;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}.hero h1{font-size:clamp(34px,6vw,54px);margin:18px 0 8px}.hero p{color:var(--muted);font-weight:300}.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);padding:8px;border-radius:17px;box-shadow:0 18px 45px #7c2d1212;margin:28px auto 35px;max-width:600px}.search input{flex:1;border:0;outline:0;padding:12px;font:inherit;min-width:0}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 15px 40px #7c2d1210}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.order-no{font-size:22px;font-weight:700}.badge{background:#fff7ed;color:#c2410c;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}.steps{display:grid;grid-template-columns:repeat(4,1fr);margin:30px 0;position:relative}.steps:before{content:"";height:4px;background:#e5e7eb;position:absolute;top:17px;left:9%;right:9%;z-index:0}.step{text-align:center;position:relative;z-index:1;font-size:12px;color:#9ca3af}.dot{width:36px;height:36px;border-radius:50%;background:#e5e7eb;margin:0 auto 8px;display:grid;place-items:center;font-weight:700}.step.active{color:#c2410c}.step.active .dot{background:var(--o);color:#fff}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.info div{background:#fffaf5;padding:13px;border-radius:12px}.info small{display:block;color:var(--muted);font-size:11px}.items{margin-top:20px;border-top:1px solid var(--line)}.item{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:30px}.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:15px}@media(max-width:600px){.nav{padding:0 4%}.nav .dark{display:none}.wrap{padding:45px 15px}.search{flex-direction:column}.steps{grid-template-columns:1fr 1fr;gap:18px}.steps:before{display:none}.info{grid-template-columns:1fr}}
</style></head>
<body>
<nav class="nav"><div class="brand"><div class="mark">บง<span>๒</span></div><div>หนองไม้งาม 2<small>SCHOOL SHOP</small></div></div><button class="btn dark" onclick="location.href='index.html'">← กลับหน้าร้าน</button></nav>
<main class="wrap"><section class="hero"><div class="eyebrow">ORDER TRACKING</div><h1>ติดตามคำสั่งซื้อ</h1><p>กรอกเลขที่คำสั่งซื้อเพื่อดูสถานะการสั่งซื้อของคุณ</p><div class="search"><input id="orderNo" placeholder="เช่น NG2-2569-00001"><button class="btn primary" onclick="track()">ค้นหาออเดอร์</button></div></section><section id="result"></section></main>
<script>
function money(n){return '฿'+Number(n||0).toLocaleString('th-TH')}
function track(){const no=document.getElementById('orderNo').value.trim();const result=document.getElementById('result');if(!no){result.innerHTML='<div class="card empty">กรุณากรอกเลขที่คำสั่งซื้อ</div>';return}const orders=JSON.parse(localStorage.getItem('schoolShopOrders')||'[]');let o=orders.find(x=>String(x.orderNo||x.id||'').toLowerCase()===no.toLowerCase());if(!o){result.innerHTML='<div class="card empty">ไม่พบคำสั่งซื้อเลขที่ <b>'+esc(no)+'</b><br><span style="font-size:12px">หากเป็นออเดอร์จากระบบรุ่นปัจจุบัน ข้อมูลอาจยังอยู่ในเบราว์เซอร์เครื่องที่สั่งซื้อเท่านั้น</span></div>';return}renderOrder(o)}
function renderOrder(o){const result=document.getElementById('result');const status=String(o.status||'waiting');const map={waiting:['รับคำสั่งซื้อแล้ว',1],preparing:['กำลังเตรียมสินค้า',2],ready:['พร้อมรับสินค้า',3],done:['รับสินค้าแล้ว',4]};const s=map[status]||map.waiting;const items=(o.items||[]).map(i=>'<div class="item"><span>'+esc(i.name||'สินค้า')+' × '+(i.qty||1)+'</span><b>'+money((i.price||0)*(i.qty||1))+'</b></div>').join('');result.innerHTML='<div class="card"><div class="order-head"><div><div style="font-size:12px;color:#6b7280">เลขที่คำสั่งซื้อ</div><div class="order-no">'+esc(o.orderNo||o.id||'-')+'</div></div><span class="badge">'+s[0]+'</span></div><div class="steps">'+['รับออเดอร์','เตรียมสินค้า','พร้อมรับ','รับสินค้าแล้ว'].map((x,i)=>'<div class="step '+(i<s[1]?'active':'')+'"><div class="dot">'+(i<s[1]?'✓':i+1)+'</div>'+x+'</div>').join('')+'</div><div class="info"><div><small>ผู้สั่งซื้อ</small>'+esc(o.buyer||'-')+'</div><div><small>วิธีรับสินค้า</small>'+esc(o.method||'รับสินค้าที่โรงเรียน')+'</div></div><div class="items">'+items+'</div><div style="display:flex;justify-content:space-between;font-size:21px;font-weight:700;padding-top:18px"><span>ยอดรวม</span><span>'+money(o.total)+'</span></div></div>'}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>

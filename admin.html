<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>หลังบ้าน | หนองไม้งาม 2 SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--orange2:#fb923c;--cream:#fff7ed;--dark:#171717;--text:#1f2937;--muted:#6b7280;--line:#eee3d8;--green:#16a34a;--blue:#2563eb;--red:#dc2626;--shadow:0 16px 45px rgba(124,45,18,.08)}*{box-sizing:border-box}body{margin:0;font-family:'Kanit',sans-serif;background:#f8fafc;color:var(--text)}button,input,select{font:inherit}.top{background:#171717;color:#fff;padding:10px 5%;font-size:13px}.layout{display:flex;min-height:100vh}.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;position:fixed;inset:0 auto 0 0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:19px;margin:4px 8px 30px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--orange),#ea580c);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 8px 20px #f9731640}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:400}.menu{display:grid;gap:7px}.menu button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:12px;cursor:pointer;color:#4b5563}.menu button.active,.menu button:hover{background:var(--cream);color:#c2410c;font-weight:600}.back{margin-top:24px;width:100%;border:1px solid var(--line);background:#fff;padding:11px;border-radius:12px;cursor:pointer}.main{margin-left:250px;width:calc(100% - 250px);padding:28px 4% 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.head h1{margin:0;font-size:30px}.head p{margin:4px 0 0;color:var(--muted);font-weight:300}.btn{border:0;border-radius:11px;padding:10px 15px;cursor:pointer;font-weight:500}.primary{background:var(--orange);color:#fff}.dark{background:#171717;color:#fff}.light{background:var(--cream);color:#c2410c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.stat .label{font-size:13px;color:var(--muted)}.stat .num{font-size:30px;font-weight:700;margin-top:6px}.stat .sub{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;margin-bottom:20px}.panel h2{font-size:19px;margin:0 0 16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #f1f1f1;text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:500}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:500}.waiting{background:#fff7ed;color:#c2410c}.preparing{background:#eff6ff;color:#1d4ed8}.ready{background:#f0fdf4;color:#15803d}.done{background:#f3f4f6;color:#4b5563}.danger{background:#fef2f2;color:#b91c1c}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input,.form select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:0}.form input:focus,.form select:focus{border-color:var(--orange)}.form .full{grid-column:1/-1}.product-actions{display:flex;gap:7px}.product-actions button{border:0;border-radius:9px;padding:7px 10px;cursor:pointer}.stock{font-weight:600}.empty{text-align:center;color:var(--muted);padding:30px}.login{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.login h1{margin-top:0}.login input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;margin:8px 0 12px}.hint{font-size:12px;color:var(--muted);font-weight:300}.mobile-nav{display:none}@media(max-width:900px){.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:650px){.side{display:none}.main{margin:0;width:100%;padding:20px 4% 50px}.mobile-nav{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:10px 4%;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat .num{font-size:24px}.head{align-items:flex-start}.head h1{font-size:24px}.form{grid-template-columns:1fr}.form .full{grid-column:auto}}
</style></head>
<body>
<div id="app"></div>
<script>
const KEY='schoolShopAdminV1';
const defaultProducts=[{id:1,name:'เสื้อโรงเรียน',cat:'เครื่องแต่งกาย',price:250,stock:50,emoji:'👕'},{id:2,name:'เสื้อกีฬาสี',cat:'เครื่องแต่งกาย',price:280,stock:40,emoji:'🏃'},{id:3,name:'กระเป๋าโรงเรียน',cat:'อุปกรณ์',price:180,stock:30,emoji:'🎒'},{id:4,name:'สมุดโรงเรียน',cat:'เครื่องเขียน',price:25,stock:100,emoji:'📓'},{id:5,name:'ปากกา',cat:'เครื่องเขียน',price:10,stock:150,emoji:'🖊️'},{id:6,name:'แก้วน้ำโรงเรียน',cat:'ของที่ระลึก',price:99,stock:40,emoji:'🥤'},{id:7,name:'พวงกุญแจ บง๒',cat:'ของที่ระลึก',price:49,stock:60,emoji:'🔑'},{id:8,name:'สติ๊กเกอร์โรงเรียน',cat:'ของที่ระลึก',price:20,stock:120,emoji:'⭐'}];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{products:defaultProducts,orders:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}const baht=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(n);function statusText(s){return{waiting:'รอรับออเดอร์',preparing:'กำลังเตรียมสินค้า',ready:'พร้อมรับสินค้า',done:'สำเร็จ'}[s]||s}function badge(s){return `<span class="badge ${s}">${statusText(s)}</span>`}
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="mark">บง๒</div><h1>ระบบหลังบ้าน</h1><p>หนองไม้งาม 2 SHOP · ผู้ดูแลร้าน</p><input id="pin" type="password" placeholder="รหัสผ่าน"><button class="btn primary" style="width:100%" onclick="checkLogin()">เข้าสู่ระบบ</button><p class="hint">ต้นแบบนี้ใช้รหัสผ่านในเบราว์เซอร์เท่านั้น ยังไม่ใช่ระบบยืนยันตัวตนจริง</p></div>`}function checkLogin(){if(document.getElementById('pin').value==='2569'){sessionStorage.admin='1';dashboard()}else alert('รหัสผ่านไม่ถูกต้อง')}function logout(){sessionStorage.removeItem('admin');login()}
function shell(){document.getElementById('app').innerHTML=`<div class="mobile-nav"><b>🟠 หลังบ้าน หนองไม้งาม 2</b><button class="btn light" onclick="logout()">ออก</button></div><aside class="side"><div class="brand"><div class="mark">บง๒</div><div>หนองไม้งาม 2<small>SHOP ADMIN</small></div></div><div class="menu"><button id="m-dashboard" onclick="dashboard()">📊 ภาพรวม</button><button id="m-orders" onclick="orders()">🧾 คำสั่งซื้อ</button><button id="m-products" onclick="productsPage()">📦 สินค้า</button></div><button class="back" onclick="location.href='index.html'">← กลับหน้าร้าน</button><button class="back" onclick="logout()">ออกจากระบบ</button></aside><main class="main"><div id="content"></div></main>`}
function nav(id){document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));document.getElementById('m-'+id)?.classList.add('active')}
function dashboard(){shell();nav('dashboard');const sales=db.orders.reduce((s,o)=>s+o.total,0),waiting=db.orders.filter(o=>o.status==='waiting').length,low=db.products.filter(p=>p.stock<=5).length;document.getElementById('content').innerHTML=`<div class="head"><div><h1>ภาพรวมร้านค้า</h1><p>จัดการสินค้าและคำสั่งซื้อจากหน้านี้</p></div><button class="btn primary" onclick="orders()">ดูคำสั่งซื้อ</button></div><div class="stats"><div class="stat"><div class="label">ยอดขายรวม</div><div class="num">${baht(sales)}</div><div class="sub">จาก ${db.orders.length} ออเดอร์</div></div><div class="stat"><div class="label">คำสั่งซื้อใหม่</div><div class="num">${waiting}</div><div class="sub">รอรับออเดอร์</div></div><div class="stat"><div class="label">สินค้า</div><div class="num">${db.products.length}</div><div class="sub">รายการในร้าน</div></div><div class="stat"><div class="label">สต็อกใกล้หมด</div><div class="num">${low}</div><div class="sub">เหลือไม่เกิน 5 ชิ้น</div></div></div><div class="grid2"><div class="panel"><h2>คำสั่งซื้อล่าสุด</h2>${ordersTable(5)}</div><div class="panel"><h2>สินค้าใกล้หมด</h2>${low?`<div>${db.products.filter(p=>p.stock<=5).map(p=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f1f1"><span>${p.emoji} ${p.name}</span><b style="color:${p.stock===0?'#dc2626':'#c2410c'}">${p.stock} ชิ้น</b></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีสินค้าใกล้หมด</div>'}</div></div>`}
function ordersTable(limit=999){if(!db.orders.length)return '<div class="empty">ยังไม่มีคำสั่งซื้อ</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>เลขที่</th><th>ผู้สั่ง</th><th>ยอดรวม</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${db.orders.slice().reverse().slice(0,limit).map(o=>`<tr><td><b>${o.no}</b><br><span class="hint">${o.date}</span></td><td>${o.buyer}<br><span class="hint">${o.contact}</span></td><td>${baht(o.total)}</td><td>${badge(o.status)}</td><td><select onchange="setStatus('${o.no}',this.value)"><option value="waiting" ${o.status==='waiting'?'selected':''}>รอรับออเดอร์</option><option value="preparing" ${o.status==='preparing'?'selected':''}>เตรียมสินค้า</option><option value="ready" ${o.status==='ready'?'selected':''}>พร้อมรับ</option><option value="done" ${o.status==='done'?'selected':''}>สำเร็จ</option></select></td></tr>`).join('')}</tbody></table></div>`}
function orders(){shell();nav('orders');document.getElementById('content').innerHTML=`<div class="head"><div><h1>คำสั่งซื้อ</h1><p>ตรวจสอบรายการและเปลี่ยนสถานะการจัดเตรียมสินค้า</p></div></div><div class="panel">${ordersTable()}</div>`}
function setStatus(no,status){const o=db.orders.find(x=>x.no===no);if(o){o.status=status;save();orders()}}
function productsPage(){shell();nav('products');document.getElementById('content').innerHTML=`<div class="head"><div><h1>จัดการสินค้า</h1><p>เพิ่ม แก้ไขราคา และปรับสต็อกสินค้า</p></div><button class="btn primary" onclick="productForm()">+ เพิ่มสินค้า</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>สินค้า</th><th>หมวดหมู่</th><th>ราคา</th><th>สต็อก</th><th>จัดการ</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${p.emoji} <b>${p.name}</b></td><td>${p.cat}</td><td>${baht(p.price)}</td><td class="stock" style="color:${p.stock<=5?'#dc2626':'#111827'}">${p.stock}</td><td class="product-actions"><button class="light" onclick="productForm(${p.id})">แก้ไข</button><button style="background:#fef2f2;color:#b91c1c" onclick="removeProduct(${p.id})">ลบ</button></td></tr>`).join('')}</tbody></table></div></div>`}
function productForm(id=null){const p=id?db.products.find(x=>x.id===id):{name:'',cat:'เครื่องเขียน',price:0,stock:0,emoji:'📦'};document.getElementById('content').innerHTML=`<div class="head"><div><h1>${id?'แก้ไขสินค้า':'เพิ่มสินค้า'}</h1><p>ข้อมูลจะถูกบันทึกในเบราว์เซอร์ของเครื่องนี้</p></div><button class="btn light" onclick="productsPage()">ยกเลิก</button></div><div class="panel"><div class="form"><div><label>ชื่อสินค้า</label><input id="pn" value="${p.name}"></div><div><label>หมวดหมู่</label><input id="pc" value="${p.cat}"></div><div><label>ราคา (บาท)</label><input id="pp" type="number" value="${p.price}"></div><div><label>สต็อก</label><input id="ps" type="number" value="${p.stock}"></div><div><label>อีโมจิ/ไอคอน</label><input id="pe" value="${p.emoji}"></div><div style="display:flex;align-items:end"><button class="btn primary" style="width:100%" onclick="saveProduct(${id||0})">บันทึกสินค้า</button></div></div></div>`}
function saveProduct(id){const data={name:document.getElementById('pn').value.trim(),cat:document.getElementById('pc').value.trim(),price:Number(document.getElementById('pp').value),stock:Number(document.getElementById('ps').value),emoji:document.getElementById('pe').value.trim()||'📦'};if(!data.name)return alert('กรุณาระบุชื่อสินค้า');if(id){Object.assign(db.products.find(p=>p.id===id),data)}else{data.id=Date.now();db.products.push(data)}save();productsPage()}
function removeProduct(id){if(confirm('ต้องการลบสินค้านี้หรือไม่?')){db.products=db.products.filter(p=>p.id!==id);save();productsPage()}}
function seedDemo(){if(db.orders.length)return;db.orders=[{no:'NGM260901',buyer:'นักเรียนตัวอย่าง',contact:'ม.2/1',method:'รับสินค้าที่โรงเรียน',total:299,status:'waiting',date:'12/09/2569 19:30'}];save()}
if(sessionStorage.admin==='1'){seedDemo();dashboard()}else login();
</script></body></html>
